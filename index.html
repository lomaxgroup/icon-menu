<style>

img{max-width:100%;display:block}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}

.hero{text-align:center;padding:26px 18px 12px}

.sub{font-family:'Montserrat',Arial,sans-serif;font-weight:300;font-size:8.5px;letter-spacing:.4em;color:#C9A24A;text-transform:uppercase;padding-left:.4em;margin-top:8px}

.bar{position:sticky;top:0;z-index:20;background:rgba(11,11,13,.96);backdrop-filter:blur(8px);

.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:0 12px 2px}

.tab{flex:0 0 auto;border:1px solid #3A342A;background:transparent;color:#C9C2B3;

 padding:10px 9px;border-radius:0;cursor:pointer;min-height:38px;white-space:nowrap}
.tab[aria-current="true"]{border-color:#C9A24A;color:#0B0B0D;background:#C9A24A}

.srch input{width:100%;background:#131316;border:1px solid #2F2A1E;color:#F4EFE3;

 color:#8F8877;font-size:20px;line-height:1;padding:6px 8px;cursor:pointer;min-height:38px}

.book{padding:22px 0 6px}
.book.light{background:#FBF8F0;color:#1D1C1A;margin-top:18px;padding-bottom:22px}

.book.light .rule{background:#CBBA92}
.book.light .n{color:#1D1C1A}
.book.light .d{color:#57513F}
.book.light .g{color:#6E6858}

.book.light .bt{color:#6E6858}

.none{text-align:center;color:#8F8877;font-size:13px;padding:40px 0}

  </div>
</nav>

<main id="app"></main>

<div class="foot">
  ICON · Restaurant &amp; Karaoke<br>
  <a href="https://instagram.com/icon_karaoke_club">@icon_karaoke_club</a><br>
  <span style="color:#5C5748">Цены указаны в рублях</span>
</div>

<div class="dock">
  <button class="b1" id="song" type="button">Заказать песню</button>
  <button class="b2" id="waiter" type="button">Позвать официанта</button>
</div>

<dialog id="dlg">
  <div class="dg">
    <h2 id="dlgT">Заказать песню</h2>
    <p id="dlgP">Напишите исполнителя и название — покажите экран официанту или отправьте ведущему.</p>
    <input id="songIn" type="text" placeholder="Исполнитель — название" autocomplete="off">
    <div class="big" id="big"><div class="q" id="bigQ"></div></div>
    <div class="row">
      <button class="b1" id="show" type="button">Показать крупно</button>
      <button class="b2" id="close" type="button">Закрыть</button>
    </div>
  </div>
</dialog>

const app = document.getElementById('app');
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function itemHTML(it, add) {
  if (it.gr) return '<div class="gr">' + esc(it.gr) + '</div>';
  const vol = it.g || (it.v ? it.v.split('/').map((x) => x.trim()).join(' / ') + ' л' : '');
  const meta = '<div class="meta">' + (vol ? '<div class="g">' + esc(vol) + '</div>' : '') +
    '<div class="p">' + esc(it.p) + '</div></div>';
  return '<div class="it' + (add ? ' add' : '') + '"><div style="flex:1 1 auto;min-width:0"><div class="n">' +
    esc(it.n) + '</div>' + (it.d ? '<div class="d">' + esc(it.d) + '</div>' : '') + '</div>' + meta + '</div>';
}

function render(filter) {
  const f = (filter || '').trim().toLowerCase();
  let out = '', found = 0;
  for (const b of DATA) {
    let body = '';
    for (const s of b.sections) {
      const items = f ? s.items.filter((i) => i.n && ((i.n + ' ' + (i.d || '')).toLowerCase().includes(f))) : s.items;
      if (!items.length) continue;
      found += items.filter((i) => i.n).length;
      body += '<div class="sh" id="s-' + encodeURIComponent(s.name) + '"><div class="rule"></div><div class="st">' +
        esc(s.name) + '</div><div class="rule"></div></div>' + items.map((i) => itemHTML(i, s.add)).join('');
    }
    if (!body) continue;
    out += '<section class="book ' + b.theme + '" id="' + b.id + '"><div class="wrap"><div class="bt">' +
      esc(b.title) + '</div>' + body + '</div></section>';
  }
  app.innerHTML = out || '<div class="none">Ничего не нашлось</div>';
  return found;
}

render('');

const q = document.getElementById('q'), clr = document.getElementById('clr');
let t;
q.addEventListener('input', () => {
  clr.hidden = !q.value;
  clearTimeout(t);
  t = setTimeout(() => render(q.value), 120);
});
clr.addEventListener('click', () => { q.value = ''; clr.hidden = true; render(''); q.focus(); });

document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-go]');
  if (!b) return;
  if (q.value) { q.value = ''; clr.hidden = true; render(''); }
  const el = document.getElementById(b.dataset.go);
  if (el) window.scrollTo({ top: el.offsetTop - 104, behavior: 'smooth' });
});

const tabs = [...document.querySelectorAll('.tab')];
addEventListener('scroll', () => {
  let cur = tabs[0];
  for (const b of tabs) {
    const el = document.getElementById(b.dataset.go);
    if (el && el.offsetTop - 140 <= scrollY) cur = b;
  }
  tabs.forEach((b) => b.setAttribute('aria-current', b === cur ? 'true' : 'false'));
}, { passive: true });

const dlg = document.getElementById('dlg'), big = document.getElementById('big'), bigQ = document.getElementById('bigQ');
const songIn = document.getElementById('songIn'), dlgT = document.getElementById('dlgT'), dlgP = document.getElementById('dlgP');
const showBtn = document.getElementById('show');

function openDlg(mode) {
  big.style.display = 'none';
  if (mode === 'song') {
    dlgT.textContent = 'Заказать песню';
    dlgP.textContent = 'Напишите исполнителя и название — покажите экран официанту или ведущему.';
    songIn.style.display = ''; songIn.value = ''; showBtn.style.display = '';
  } else {
    dlgT.textContent = 'Позвать официанта';
    dlgP.textContent = 'Поднимите руку или покажите этот экран — к вам подойдут.';
    songIn.style.display = 'none'; showBtn.style.display = 'none';
    big.style.display = 'block'; bigQ.textContent = 'Нас ждут за столом';
  }
  dlg.showModal();
}
document.getElementById('song').addEventListener('click', () => openDlg('song'));
document.getElementById('waiter').addEventListener('click', () => openDlg('waiter'));
showBtn.addEventListener('click', () => {
  const v = songIn.value.trim();
  if (!v) { songIn.focus(); return; }
  bigQ.textContent = v; big.style.display = 'block';
});
document.getElementById('close').addEventListener('click', () => dlg.close());
</script>
